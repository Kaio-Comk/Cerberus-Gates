[project]
name = "codegates"
version = "0.1.0"
description = "AST regression gates for Python: silent except, swallowed cancellation, blocking calls in async def"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codegates = "codegates.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codegates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
